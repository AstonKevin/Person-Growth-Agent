# =====================================================
# 个人成长 Agent —— 调整规则库
# 改规则只改这里，无需改代码。
# =====================================================

# ---------- 天气 ----------
weather:
  api_url: "https://api.open-meteo.com/v1/forecast"
  timeout: 10
  forecast_days: 7
  # 不宜户外的判定阈值
  unfriendly:
    precip_prob_above: 60    # 降水概率 > 60
    temp_max_above: 35       # 最高气温 >= 35
    temp_min_below: 0        # 最低气温 <= 0

# ---------- 城市经纬度（Open-Meteo 用）----------
cities:
  周口: [33.63, 114.65]
  郑州: [34.75, 113.62]
  北京: [39.90, 116.40]
  上海: [31.23, 121.47]
  广州: [23.13, 113.26]
  南京: [32.06, 118.80]

# ---------- 户外运动关键词 ----------
outdoor_keywords:
  - 跑步
  - 晨跑
  - 夜跑
  - 骑行
  - 骑车
  - 爬山
  - 登山
  - 篮球
  - 足球
  - 网球
  - 球类
  - 散步
  - 快走

# ---------- 任务类型 → 推荐时段 ----------
slots:
  记忆/学习: ["07:00", "08:00"]
  深度专注: ["09:00", "11:00"]
  锻炼/健身: ["17:00", "18:00"]
  户外运动: ["06:30", "07:30"]
  复盘/总结: ["20:00", "21:00"]

# ---------- 任务分类关键词（按顺序判断，命中即返回）----------
# 命中“锻炼/健身”时，会再用 outdoor_keywords 判定是户外运动还是室内健身
classify_keywords:
  复盘/总结: [复盘, 总结, 规划, 整理]
  锻炼/健身: [跑, 锻炼, 健身, 训练, 运动, 游泳]
  记忆/学习: [背, 单词, 记忆, 阅读, 学习]
default_category: 深度专注

# ---------- 进度判定阈值 ----------
progress:
  on_track_above: 0.8          # >= 0.8 正常
  slightly_behind_above: 0.4   # >= 0.4 轻微落后；否则严重落后
  trend_delta: 0.1             # 与历史均值差 > 0.1 才算上升/下降
  consecutive_miss: 2          # 连续未完成天数达到该值，触发延期
